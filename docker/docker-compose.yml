# Postgres and Qdrant for Relay. Started and stopped by the `relay` command,
# which supplies every ${VARIABLE} below from ~/.relay/.env. You don't run
# this by hand.
#
# Both ports are published on 127.0.0.1 only, so nothing else on your network
# can reach your indexed documents, and both require a password / API key.
name: ${RELAY_PROJECT:-relay}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run "relay setup" first}
      POSTGRES_DB: relay
    ports:
      - "127.0.0.1:${RELAY_PG_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 3s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.18.3
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?run "relay setup" first}
    ports:
      - "127.0.0.1:${RELAY_QDRANT_PORT:-6335}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  pg_data:
  qdrant_data:
